name: Autoformat Xiri updater (temporary)
on:
  push:
    branches: [feature/destinia-private-updates]
permissions:
  contents: write
concurrency:
  group: temp-autoformat-xiri-update
  cancel-in-progress: true
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/destinia-private-updates
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources
        run: |
          set -euo pipefail
          cargo fmt --all
          git add crates/native/src/xiri_self_update.rs crates/native/src/xiri_backend.rs crates/native/src/lib.rs crates/ui-egui/src/xiri_destinia.rs crates/ui-egui/src/app.rs apps/xiri-launcher/src/main.rs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style: rustfmt do botão Atualizar Xiri Launcher'
            git push origin HEAD:feature/destinia-private-updates
          fi
