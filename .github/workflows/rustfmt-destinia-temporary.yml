name: Rustfmt Destinia updater (temporary)
on:
  push:
    branches: [feature/destinia-private-updates]
permissions:
  contents: write
concurrency:
  group: rustfmt-destinia-updater
  cancel-in-progress: true
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/destinia-private-updates
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format updated Rust sources
        run: |
          set -euo pipefail
          cargo fmt --all
          git add crates/core/src/protocol.rs crates/native/src/backend.rs crates/native/src/destinia_updates.rs crates/native/src/lib.rs crates/native/src/xiri_backend.rs crates/ui-egui/src/app.rs crates/ui-egui/src/lib.rs crates/ui-egui/src/settings.rs crates/ui-egui/src/views.rs crates/ui-egui/src/xiri_destinia.rs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style: aplica rustfmt a instalação automática Destinia'
            git push origin HEAD:feature/destinia-private-updates
          fi
